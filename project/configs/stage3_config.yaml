# ============================================================
# Stage 3: AI-Based MRI Image Enhancement - Master Configuration
# MedhaDrishti National-Level AI Hackathon
# ============================================================

seed: 42

# ------------------------------------------------------------
# Dataset Configuration
# ------------------------------------------------------------
dataset:
  preprocessed_dir: "stage2/preprocessed"
  target_size: 256
  train_ratio: 0.80
  max_samples: null
  batch_size:
    cuda: 4
    cpu: 2
  num_workers: 0

# ------------------------------------------------------------
# Training Configuration
# ------------------------------------------------------------
training:
  max_epochs: 20
  early_stopping:
    patience: 20
    min_delta: 1.0e-6
  mixed_precision: true
  gradient_accumulation_steps: 2
  gradient_clip_norm: 1.0
  checkpoint_by: "val_psnr"

# ------------------------------------------------------------
# Optimizer Configuration
# ------------------------------------------------------------
optimizer:
  name: "AdamW"
  lr: 2.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

# ------------------------------------------------------------
# Learning Rate Scheduler Configuration
# ------------------------------------------------------------
scheduler:
  name: "CosineAnnealingWarmRestarts"
  T_0: 50
  T_mult: 2
  eta_min: 1.0e-7
  warmup_epochs: 5

# ------------------------------------------------------------
# Loss Function Configuration
# ------------------------------------------------------------
loss:
  name: "HybridLoss"
  weights:
    charbonnier: 0.10
    ssim: 0.80
    perceptual: 0.05
    edge: 0.05
  charbonnier:
    eps: 1.0e-6
  ssim:
    window_size: 11
  perceptual:
    layer_weights:
      relu1_2: 0.25
      relu2_2: 0.25
      relu3_3: 0.25
      relu4_3: 0.25
  edge:
    method: "sobel"

# ------------------------------------------------------------
# Data Augmentation Configuration
# ------------------------------------------------------------
augmentation:
  random_rotation:
    enabled: true
    max_angle: 15.0
  random_gamma:
    enabled: true
    gamma_range: [0.7, 1.5]
  random_intensity_scaling:
    enabled: true
    scale_range: [0.8, 1.2]
  random_gaussian_noise:
    enabled: true
    std_range: [0.005, 0.02]
  random_contrast:
    enabled: true
    factor_range: [0.7, 1.3]
  random_brightness:
    enabled: true
    brightness_range: [-0.15, 0.15]
  elastic_deformation:
    enabled: true
    alpha: 200.0
    sigma: 10.0
  random_affine:
    enabled: true
    degrees: 10
    translate: [0.05, 0.05]
    scale: [0.95, 1.05]
  random_cropping:
    enabled: true
    crop_ratio: 0.9
  patch_extraction:
    enabled: true
    patch_size: 128
    stride: 64

# ------------------------------------------------------------
# Model Definitions
# ------------------------------------------------------------
models:
  SwinIR_Large:
    enabled: false
    in_channels: 1
    out_channels: 1
    embed_dim: 180
    num_heads: 6
    window_size: 8
    depth: [6, 6, 6, 6]

  Restormer:
    enabled: false
    in_channels: 1
    out_channels: 1
    dim: 48
    num_blocks: [4, 6, 6, 8]
    num_refinement_blocks: 4
    heads: [1, 2, 4, 8]
    ffn_expansion_factor: 2.66

  MIRNet_v2:
    enabled: false
    in_channels: 1
    out_channels: 1
    features: [32, 64, 128]
    num_blocks_per_group: 2

  NAFNet:
    enabled: false
    in_channels: 1
    out_channels: 1
    width: 32
    middle_blk_num: 1
    enc_blk_nums: [2, 2, 4, 8]
    dec_blk_nums: [2, 2, 2, 2]

  DnCNN:
    enabled: true
    in_channels: 1
    out_channels: 1
    num_features: 96
    num_layers: 20

# ------------------------------------------------------------
# Evaluation Configuration
# ------------------------------------------------------------
evaluation:
  metrics:
    - PSNR
    - SSIM
    - LPIPS
    - FSIM
    - VIF
    - UQI
    - MSE
    - RMSE
    - NIQE
    - BRISQUE
    - PIQE
    - Entropy
    - Contrast
    - Sharpness
    - EdgeStrength
    - NoiseLevel
  infrastructure_metrics:
    - Inference_Time_ms
    - GPU_Memory_MB
    - Model_Size_MB

# ------------------------------------------------------------
# Model Ranking Configuration
# ------------------------------------------------------------
ranking:
  primary_metrics:
    - metric: "PSNR"
      direction: "higher_better"
      weight: 0.30
    - metric: "SSIM"
      direction: "higher_better"
      weight: 0.25
    - metric: "LPIPS"
      direction: "lower_better"
      weight: 0.15
    - metric: "NIQE"
      direction: "lower_better"
      weight: 0.15
    - metric: "BRISQUE"
      direction: "lower_better"
      weight: 0.15

# ------------------------------------------------------------
# Output Configuration
# ------------------------------------------------------------
output:
  base_dir: "stage3"
  checkpoints_dir: "stage3/checkpoints"
  logs_dir: "stage3/logs"
  metrics_dir: "stage3/metrics"
  reports_dir: "stage3/reports"
  visualizations_dir: "stage3/visualizations"
  charts_dir: "stage3/visualizations/charts"
  comparisons_dir: "stage3/visualizations/comparisons"
